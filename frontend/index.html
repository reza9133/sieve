    <script>
      // Anti-flash theme script: runs synchronously before React mounts
      (function () {
        try {
          var stored = localStorage.getItem('sieve-theme');
          var theme = stored;
          if (!theme || (theme !== 'light' && theme !== 'dim' && theme !== 'dark')) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
