    <line x1="7" y1="18" x2="29" y2="18" stroke="currentColor" stroke-width="1.5" stroke-dasharray="1.5 2" stroke-linecap="round" opacity="0.6" />
    <circle cx="13" cy="11" r="2" fill="currentColor" opacity="0.5" />
    <circle cx="18" cy="9" r="2.2" fill="url(#sieve-logo-grad)" />
    <circle cx="23" cy="12" r="1.8" fill="currentColor" opacity="0.4" />
