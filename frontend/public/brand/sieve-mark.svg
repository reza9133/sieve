<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="sieve-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-accent, #7c3aed)" />
      <stop offset="100%" stop-color="var(--color-accent-2, #a855f7)" />
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="24" cy="24" r="21" stroke="url(#sieve-grad)" stroke-width="3" />
  <!-- Mesh separator line -->
  <line x1="10" y1="24" x2="38" y2="24" stroke="currentColor" stroke-width="2" stroke-dasharray="2 3" stroke-linecap="round" opacity="0.6" />
  <!-- Upper incoming particles -->
  <circle cx="17" cy="14" r="2.5" fill="currentColor" opacity="0.5" />
  <circle cx="24" cy="12" r="2.8" fill="url(#sieve-grad)" />
  <circle cx="31" cy="16" r="2.2" fill="currentColor" opacity="0.4" />
  <!-- Sifted / winning particle passing through and settled -->
  <circle cx="24" cy="24" r="2.5" fill="url(#sieve-grad)" />
  <circle cx="24" cy="33" r="3.5" fill="url(#sieve-grad)" />
</svg>
